<section class="w-full space-y-6 text-[13px] text-[#1f2933]">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-[20px] leading-7 font-bold tracking-tight text-[#17304f]">
        Overview & Analytics
      </h2>
      <p class="mt-0.5 text-xs text-[#4b5563]">
        High-level operational status and quick entry into daily operations and sales snapshots.
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <a
        routerLink="/overview/daily-operations"
        class="inline-flex h-8 items-center border border-[#b9c7d6] bg-white px-3 text-xs font-medium text-[#17304f] hover:bg-[#e1e6ed]">
        Daily Operations
      </a>
      <a
        routerLink="/overview/sales-snapshot"
        class="inline-flex h-8 items-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-3.5 text-xs font-medium text-white shadow-[0_1px_2px_rgba(23,48,79,0.35)] hover:bg-[#164b82]">
        Sales & Orders Snapshot
      </a>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
    @for (card of kpis(); track card.label) {
      <article class="border border-t-[3px] border-[#c5ced9] border-t-[#b8cbe0] bg-white p-4">
        <span class="block text-xs text-[#4b5563]">{{ card.label }}</span>
        <strong class="mt-1 block text-lg font-bold text-[#17304f]">{{ card.value }}</strong>
        <p class="mt-1 text-xs text-[#64748b]">{{ card.subtext }}</p>
        <a
          [routerLink]="card.route"
          class="mt-3 inline-block text-xs font-medium text-[#1b5a9a] hover:underline">
          {{ card.linkLabel }} →
        </a>
      </article>
    }
  </div>
</section>
