<header class="fixed inset-x-0 top-0 z-50 w-full text-[13px] antialiased">

  <!-- BRAND BAR -->
  <div class="flex h-14 w-full items-center justify-between gap-6 bg-[#17304f] px-7">

    <!-- Brand -->
    <div class="flex shrink-0 items-center">
      <span class="text-[24px] leading-none font-semibold tracking-wider text-white">BOTEBO</span>
      
      <span class="mx-5 h-6 w-px bg-white/25"></span>
      <span class="text-[15px] text-white">Enterprise Management</span>
    </div>

    <!-- Search, notifications, profile -->
    <div class="flex min-w-0 items-center gap-3">

      <form
        class="flex h-8 w-[26rem] min-w-[14rem] max-w-full items-center border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus-within:border-[#1b5a9a] focus-within:ring-1 focus-within:ring-[#1b5a9a]"
        (submit)="onSearch($event, searchInput.value, searchType.value)">

        <!-- Search category -->
        <div class="relative flex h-full shrink-0 items-center border-r border-[#c9d4e1]">
          <select
            #searchType
            (change)="updateSearchPlaceholder(searchType.value)"
            class="h-full cursor-pointer appearance-none bg-transparent pr-7 pl-3 text-[13px] text-[#1f2933] outline-none">
            <option class="bg-white text-[#1f2933]" value="Order">Order</option>
            <option class="bg-white text-[#1f2933]" value="Customer">Customer</option>
            <option class="bg-white text-[#1f2933]" value="Supplier">Supplier</option>
            <option class="bg-white text-[#1f2933]" value="Invoice">Invoice</option>
            <option class="bg-white text-[#1f2933]" value="Quotation">Quotation</option>
          </select>
          <span class="pointer-events-none absolute right-3 text-[9px] text-[#374151]">▾</span>
        </div>

        <!-- Search input -->
        <input
          #searchInput
          type="search"
          [placeholder]="searchPlaceholder"
          class="h-full min-w-0 flex-1 bg-transparent px-3 text-[13px] text-[#1f2933] outline-none placeholder:text-[#6b7280]" />

        <!-- Search button -->
        <button
          type="submit"
          aria-label="Search"
          class="flex h-full w-9 shrink-0 cursor-pointer items-center justify-center border-l border-[#12283f] bg-[#1b5a9a] text-white transition-colors hover:bg-[#164b82] focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-white/70">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>
        </button>

      </form>

      <!-- Notifications -->
      <button
        type="button"
        aria-label="Notifications"
        class="relative flex h-8 w-8 cursor-pointer items-center justify-center border border-t-[#b9c7d6] border-l-[#b9c7d6] border-b-[#8ba0b7] border-r-[#8ba0b7] bg-white text-[#17304f] shadow-[0_1px_2px_rgba(23,48,79,0.18)] transition-colors hover:bg-[#e1e6ed] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>
        <span class="absolute top-1 right-1 h-2 w-2 border border-white bg-[#1b5a9a]"></span>
      </button>

      <!-- User profile -->
      <button
        type="button"
        aria-label="User profile"
        class="flex h-8 w-8 cursor-pointer items-center justify-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] text-[13px] font-medium text-white shadow-[0_1px_2px_rgba(23,48,79,0.35)] transition-colors hover:bg-[#164b82] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70">
        {{ userInitial }}
      </button>

    </div>

  </div>

  <!-- MENU BAR -->
  <nav class="flex h-10 w-full items-center border-b border-[#c5ced9] bg-white px-3" aria-label="Application menu">
    @for (item of menuItems; track item) {
      <button
        type="button"
        (click)="menuSelected.emit(item)"
        class="h-full cursor-pointer px-3.5 text-[13px] text-[#1f2933] transition-colors hover:bg-[#e1e6ed] focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#1b5a9a]">
        {{ item }}
      </button>
    }
  </nav>

</header>
