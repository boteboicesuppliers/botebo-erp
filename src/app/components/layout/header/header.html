
<header class="flex h-20 w-full items-center justify-between gap-6 border-b border-slate-200 bg-white px-6">

  <!-- Left: Page Title and Breadcrumbs -->
  <div class="flex min-w-[200px] shrink-0 flex-col justify-center">

    <h1 class="text-xl font-medium tracking-tight text-slate-900">
      {{ pageTitle }}
    </h1>

    @if (breadcrumbs.length > 0) {
      <div class="mt-1 flex items-center gap-2 text-xs text-slate-400">

        @for (crumb of breadcrumbs; track crumb; let last = $last) {
          @if (!last) {
            <span>{{ crumb }}</span>

            <svg
              class="h-3 w-3 text-slate-300"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/>
            </svg>
          } @else {
            <span class="text-slate-600">{{ crumb }}</span>
          }
        }

      </div>
    }

  </div>


  <!-- Centre: Search Bar -->
  <div class="flex min-w-0 flex-1 justify-center px-6">

    <form
      class="flex h-11 w-full max-w-[1000px] items-center overflow-hidden rounded-lg border border-slate-200 bg-white transition-all duration-200 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-50"
      (submit)="onSearch($event, searchInput.value, searchType.value)">

      <!-- Search Category Dropdown -->
      <div class="relative flex h-full shrink-0 items-center border-r border-slate-200 bg-slate-50">

        <select
          #searchType
          (change)="updateSearchPlaceholder(searchType.value)"
          class="h-full w-full cursor-pointer appearance-none bg-transparent py-0 pl-4 pr-11 text-sm font-normal text-slate-600 outline-none">

          <option value="Order">Order</option>
          <option value="Customer">Customer</option>
          <option value="Supplier">Supplier</option>
          <option value="Invoice">Invoice</option>
          <option value="Quotation">Quotation</option>

        </select>

        <!-- Custom Dropdown Chevron -->
        <svg
          class="pointer-events-none absolute right-4 h-4 w-4 text-slate-400"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24">

          <path d="m6 9 6 6 6-6"/>

        </svg>

      </div>


      <!-- Search Input -->
      <input
        #searchInput
        type="search"
        [placeholder]="searchPlaceholder"
        class="h-full min-w-0 flex-1 bg-transparent px-4 text-sm font-normal text-slate-700 outline-none placeholder:text-slate-400"
      />


      <!-- Search Button -->
      <button
        type="submit"
        aria-label="Search"
        class="flex h-full w-12 shrink-0 cursor-pointer items-center justify-center border-l border-slate-200 text-slate-500 transition-colors duration-200 hover:bg-blue-50 hover:text-blue-600">

        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24">

          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-4-4"/>

        </svg>

      </button>

    </form>

  </div>


  <!-- Right: Notifications and Profile -->
  <div class="flex shrink-0 items-center gap-3">

    <!-- Notifications -->
    <button
      type="button"
      aria-label="Notifications"
      class="relative flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg border border-slate-200 text-slate-500 transition-colors hover:bg-slate-50 hover:text-slate-800">

      <svg
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        viewBox="0 0 24 24">

        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>

      </svg>

      <span class="absolute right-2 top-2 h-2 w-2 rounded-full border border-white bg-blue-600"></span>

    </button>


    <!-- User Profile -->
    <button
      type="button"
      aria-label="User profile"
      class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-blue-600 text-sm font-medium text-white transition-colors hover:bg-blue-700">

      {{ userInitial }}

    </button>

  </div>

</header>
