<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
  <div class="w-full max-w-2xl border border-[#c5ced9] bg-white text-[13px] text-[#1f2933] shadow-lg">

    <div class="flex items-center justify-between border-b border-[#c5ced9] px-5 py-4">
      <div>
        <h2 class="text-[20px] leading-7 font-bold tracking-tight text-[#17304f]">New Request for Quote (RFQ)</h2>
        <p class="mt-0.5 text-xs text-[#4b5563]">Issue a supplier quotation request for raw materials or packaging</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close modal"
        class="flex h-8 w-8 items-center justify-center text-[#4b5563] transition-colors hover:bg-[#e1e6ed] hover:text-[#17304f]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form (submit)="$event.preventDefault(); submitForm()" class="space-y-5 px-5 py-5">

      <div>
        <h3 class="mb-3 text-[11px] font-semibold tracking-wide text-[#374151] uppercase">Vendor & Item Specification</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label class="mb-1 block text-xs font-normal text-[#374151]">Target Supplier / Vendor *</label>
            <input
              type="text"
              [value]="supplier()"
              (input)="supplier.set($any($event.target).value)"
              placeholder="e.g. Gauteng Chemical Supplies"
              class="h-8 w-full border bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] placeholder:text-[#6b7280] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]"
              [class]="submitted() && !supplier().trim() ? 'border-t-red-500 border-l-red-500 border-b-red-600 border-r-red-600' : 'border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3]'" />
            @if (submitted() && !supplier().trim()) {
              <p class="mt-1 text-xs text-red-700">Supplier name is required.</p>
            }
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-xs font-normal text-[#374151]">Item & Quantity Specification *</label>
            <input
              type="text"
              [value]="item()"
              (input)="item.set($any($event.target).value)"
              placeholder="e.g. Ammonia Refrigerant (500kg)"
              class="h-8 w-full border bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] placeholder:text-[#6b7280] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]"
              [class]="submitted() && !item().trim() ? 'border-t-red-500 border-l-red-500 border-b-red-600 border-r-red-600' : 'border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3]'" />
            @if (submitted() && !item().trim()) {
              <p class="mt-1 text-xs text-red-700">Item specification is required.</p>
            }
          </div>
        </div>
      </div>

      <div class="border-t border-[#c5ced9] pt-5">
        <h3 class="mb-3 text-[11px] font-semibold tracking-wide text-[#374151] uppercase">Bidding Schedule & Status</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Submission Deadline</label>
            <input
              type="date"
              [value]="deadline()"
              (input)="deadline.set($any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Quotes Received</label>
            <input
              type="text"
              [value]="quotesReceived()"
              (input)="quotesReceived.set($any($event.target).value)"
              placeholder="e.g. 0 of 3"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] placeholder:text-[#6b7280] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">RFQ Status</label>
            <select
              [value]="status()"
              (change)="status.set($any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]">
              <option value="Active">Active</option>
              <option value="Evaluating">Evaluating</option>
              <option value="Awarded">Awarded</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2.5 border-t border-[#c5ced9] pt-3.5">
        <button
          type="button"
          (click)="close.emit()"
          class="inline-flex h-8 min-w-[5.5rem] items-center justify-center border border-t-[#b9c7d6] border-l-[#b9c7d6] border-b-[#8ba0b7] border-r-[#8ba0b7] bg-white px-4 text-[13px] font-normal text-[#17304f] shadow-[0_1px_2px_rgba(23,48,79,0.18)] hover:bg-[#e1e6ed]">
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-8 min-w-[6rem] items-center justify-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-5 text-[13px] font-medium text-white shadow-[0_1px_2px_rgba(23,48,79,0.35)] transition-colors hover:bg-[#164b82]">
          Issue RFQ
        </button>
      </div>

    </form>
  </div>
</div>
