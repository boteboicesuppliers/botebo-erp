
<aside class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col bg-white text-slate-600 font-sans antialiased border-r border-slate-200">

  <!-- Brand -->
  <div class="flex h-20 shrink-0 items-center gap-3 border-b border-slate-200 px-6">

    <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600">
      <span class="text-2xl font-semibold tracking-tight text-white">B</span>
    </div>

    <h1 class="text-xl font-medium tracking-tight text-slate-900">
      Botebo ERP
    </h1>

  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-7">

    @for (item of navigation; track item.route) {

      <a
        [routerLink]="item.route"
        routerLinkActive="!border-blue-600 !bg-blue-50 !text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group relative flex w-full items-center gap-4 border-l-4 border-transparent px-5 py-4 text-base font-normal tracking-normal text-slate-600 transition-colors duration-200 hover:bg-slate-50 hover:text-slate-900">

        <!-- Navigation Icons -->
        <svg
          class="h-6 w-6 shrink-0 text-current opacity-80 transition-opacity duration-200 group-hover:opacity-100"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24">

          @switch (item.name) {

            @case ('Dashboard') {
              <rect x="3" y="3" width="8" height="8" rx="1.5"/>
              <rect x="13" y="3" width="8" height="5" rx="1.5"/>
              <rect x="13" y="10" width="8" height="11" rx="1.5"/>
              <rect x="3" y="13" width="8" height="8" rx="1.5"/>
            }

            @case ('Inventory') {
              <path d="m3 7 9-4 9 4-9 4-9-4Z"/>
              <path d="M3 7v10l9 4 9-4V7"/>
              <path d="M12 11v10"/>
            }

            @case ('Sales Orders') {
              <path d="M8 3h8l4 4v14H4V3h4Z"/>
              <path d="M16 3v5h4"/>
              <path d="M8 13h8M8 17h8"/>
            }

            @case ('Customers') {
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            }

            @case ('Suppliers') {
              <path d="M3 21h18M5 21V7l7-4 7 4v14"/>
              <path d="M9 21v-5h6v5M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/>
            }

            @case ('Logistics') {
              <path d="M3 7h11v11H3z"/>
              <path d="M14 11h4l3 3v4h-7z"/>
              <circle cx="7.5" cy="19" r="2"/>
              <circle cx="17.5" cy="19" r="2"/>
              <path d="M14 14h7"/>
            }

            @case ('Financials') {
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 10h18"/>
              <path d="M7 15h4"/>
            }

            @case ('Analytics') {
              <path d="M3 3v18h18"/>
              <path d="m7 14 4-4 4 3 6-7"/>
            }

          }

        </svg>

        <!-- Navigation Label -->
        <span class="flex-1">
          {{ item.name }}
        </span>

        <!-- Active Indicator -->
        <span class="h-2 w-2 rounded-full bg-blue-600 opacity-0 transition-opacity group-[.active]:opacity-100"></span>

      </a>

    }

  </nav>

  <!-- Bottom Actions -->
  <div class="shrink-0 border-t border-slate-200 p-4">

    <button
      type="button"
      class="flex w-full items-center gap-4 px-4 py-3 text-base font-normal text-slate-500 transition-colors duration-200 hover:bg-red-50 hover:text-red-600">

      <!-- Logout Icon -->
      <svg
        class="h-6 w-6 shrink-0"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        viewBox="0 0 24 24">

        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>

      </svg>

      <span>Logout</span>

    </button>

  </div>

</aside>
