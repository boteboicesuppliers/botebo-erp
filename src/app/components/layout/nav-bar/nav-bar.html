<!-- Starts below the 96px header (56px brand bar + 40px menu bar) -->
<aside class="fixed top-24 bottom-0 left-0 z-40 flex w-64 flex-col border-r border-[#c5ced9] bg-white text-[13px] text-[#374151] antialiased">

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-3">

    @for (item of navigation; track item.route) {

      <a
        [routerLink]="item.route"
        routerLinkActive="!border-[#1b5a9a] !bg-[#dde9f7] !font-medium !text-[#1b5a9a]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex h-10 w-full cursor-pointer items-center gap-3 border-l-[3px] border-transparent px-5 text-[13px] text-[#374151] transition-colors duration-150 hover:bg-[#f5f8fc] hover:text-[#17304f] focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#1b5a9a]">

        <!-- Navigation Icons -->
        <svg
          class="h-[18px] w-[18px] shrink-0 text-current"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24">

          @switch (item.name) {

            @case ('Dashboard') {
              <rect x="3" y="3" width="8" height="8" rx="1.5"/>
              <rect x="13" y="3" width="8" height="5" rx="1.5"/>
              <rect x="13" y="10" width="8" height="11" rx="1.5"/>
              <rect x="3" y="13" width="8" height="8" rx="1.5"/>
            }

            @case ('Inventory') {
              <path d="m3 7 9-4 9 4-9 4-9-4Z"/>
              <path d="M3 7v10l9 4 9-4V7"/>
              <path d="M12 11v10"/>
            }

            @case ('Sales Orders') {
              <path d="M8 3h8l4 4v14H4V3h4Z"/>
              <path d="M16 3v5h4"/>
              <path d="M8 13h8M8 17h8"/>
            }

            @case ('Purchases') {
              <path d="M3 4h2l2.4 11h10.2L20 7H6"/>
              <circle cx="9.5" cy="19.5" r="1.5"/>
              <circle cx="17" cy="19.5" r="1.5"/>
            }

            @case ('Invoices') {
              <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/>
              <path d="M9 8h6M9 12h6M9 16h3"/>
            }

            @case ('Quotations') {
              <rect x="5" y="4" width="14" height="17" rx="2"/>
              <path d="M9 4h6v3H9z"/>
              <path d="m9 14 2 2 4-4"/>
            }

            @case ('Contracts') {
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            }

            @case ('Suppliers') {
              <path d="M3 21h18M5 21V7l7-4 7 4v14"/>
              <path d="M9 21v-5h6v5M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/>
            }

            @case ('Logistics') {
              <path d="M3 7h11v11H3z"/>
              <path d="M14 11h4l3 3v4h-7z"/>
              <circle cx="7.5" cy="19" r="2"/>
              <circle cx="17.5" cy="19" r="2"/>
              <path d="M14 14h7"/>
            }

            @case ('Financials') {
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 10h18"/>
              <path d="M7 15h4"/>
            }

            @case ('Analytics') {
              <path d="M3 3v18h18"/>
              <path d="m7 14 4-4 4 3 6-7"/>
            }

          }

        </svg>

        <!-- Navigation Label -->
        <span class="flex-1">
          {{ item.name }}
        </span>

      </a>

    }

  </nav>

  <!-- Bottom Actions (no padding so the hover highlight spans the full sidebar width) -->
  <div class="shrink-0 border-t border-[#c5ced9]">

    <button
      type="button"
      (click)="logout()"
      class="flex h-10 w-full cursor-pointer items-center gap-3 border-l-[3px] border-transparent px-5 text-[13px] text-[#374151] transition-colors duration-150 hover:bg-red-50 hover:text-red-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#1b5a9a]">

      <!-- Logout Icon -->
      <svg
        class="h-[18px] w-[18px] shrink-0"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        viewBox="0 0 24 24">

        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>

      </svg>

      <span>Logout</span>

    </button>

  </div>

</aside>
