<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4 backdrop-blur-[1px]">
  <div class="flex max-h-[90vh] w-full max-w-2xl flex-col border border-[#c5ced9] bg-white text-[13px] text-[#1f2933] shadow-lg">
    <div class="flex items-center justify-between border-b border-[#c5ced9] px-5 py-4">
      <div>
        <h2 class="text-[20px] leading-7 font-bold tracking-tight text-[#17304f]">New Finished Good</h2>
        <p class="mt-0.5 text-xs text-[#4b5563]">Add a sellable ice product, pack weight, pricing, and cold-room location.</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close modal"
        class="flex h-8 w-8 items-center justify-center text-[#4b5563] hover:bg-[#e1e6ed] hover:text-[#17304f]">
        ×
      </button>
    </div>

    <form (ngSubmit)="submitForm()" class="space-y-4 overflow-y-auto px-5 py-5">
      @if (errorMessage()) {
        <div class="border border-red-300 bg-red-50 px-3 py-2 text-xs font-medium text-red-800">
          {{ errorMessage() }}
        </div>
      }

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">SKU *</label>
          <input
            type="text"
            [ngModel]="sku()"
            (ngModelChange)="sku.set($event)"
            name="sku"
            placeholder="e.g. ICE-2KG-BAG"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div class="sm:col-span-2">
          <label class="mb-1 block text-xs font-medium text-[#374151]">Product Name *</label>
          <input
            type="text"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            name="name"
            placeholder="e.g. 2kg Party Cube Ice Bag"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-4">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Pack Size</label>
          <input
            type="text"
            [ngModel]="packSize()"
            (ngModelChange)="packSize.set($event)"
            name="packSize"
            placeholder="e.g. 2kg, 5kg, 10kg"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Category</label>
          <input
            type="text"
            [ngModel]="category()"
            (ngModelChange)="category.set($event)"
            name="category"
            placeholder="e.g. Bagged Ice"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">UOM</label>
          <input
            type="text"
            [ngModel]="unitOfMeasure()"
            (ngModelChange)="unitOfMeasure.set($event)"
            name="unitOfMeasure"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Storage Location</label>
          <input
            type="text"
            [ngModel]="location()"
            (ngModelChange)="location.set($event)"
            name="location"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-5">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">On Hand</label>
          <input
            type="number"
            min="0"
            [ngModel]="onHandQty()"
            (ngModelChange)="onHandQty.set($event)"
            name="onHandQty"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Reserved</label>
          <input
            type="number"
            min="0"
            [ngModel]="reservedQty()"
            (ngModelChange)="reservedQty.set($event)"
            name="reservedQty"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Reorder Pt</label>
          <input
            type="number"
            min="0"
            [ngModel]="reorderPoint()"
            (ngModelChange)="reorderPoint.set($event)"
            name="reorderPoint"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Unit Cost (R)</label>
          <input
            type="number"
            min="0"
            step="0.01"
            [ngModel]="unitCost()"
            (ngModelChange)="unitCost.set($event)"
            name="unitCost"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Unit Price (R)</label>
          <input
            type="number"
            min="0"
            step="0.01"
            [ngModel]="unitPrice()"
            (ngModelChange)="unitPrice.set($event)"
            name="unitPrice"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>
      </div>

      <label class="inline-flex cursor-pointer items-center gap-2 pt-1 text-xs font-medium text-[#374151]">
        <input
          type="checkbox"
          [ngModel]="active()"
          (ngModelChange)="active.set($event)"
          name="active"
          class="h-4 w-4 border-[#9fb0c3] text-[#1b5a9a]" />
        <span>Active finished good for sales & production</span>
      </label>

      <div class="flex items-center justify-end gap-2 border-t border-[#c5ced9] pt-4">
        <button
          type="button"
          (click)="close.emit()"
          class="inline-flex h-8 items-center border border-[#b9c7d6] bg-white px-3.5 text-xs text-[#17304f] hover:bg-[#e1e6ed]">
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-8 items-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-4 text-xs font-medium text-white hover:bg-[#164b82]">
          Save Finished Good
        </button>
      </div>
    </form>
  </div>
</div>
