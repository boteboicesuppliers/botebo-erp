<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
  <div class="w-full max-w-2xl border border-[#c5ced9] bg-white text-[13px] text-[#1f2933] shadow-lg">

    <!-- MODAL HEADER -->
    <div class="flex items-center justify-between border-b border-[#c5ced9] px-5 py-4">
      <div>
        <h2 class="text-[20px] leading-7 font-bold tracking-tight text-[#17304f]">Edit Opportunity · {{ opportunity().id }}</h2>
        <p class="mt-0.5 text-xs text-[#4b5563]">Update deal stage progression, value, or gross margin terms</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close modal"
        class="flex h-8 w-8 items-center justify-center text-[#4b5563] transition-colors hover:bg-[#e1e6ed] hover:text-[#17304f]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- MODAL BODY -->
    <form (submit)="$event.preventDefault(); submitEdit()" class="space-y-5 px-5 py-5">

      <!-- SECTION 1 -->
      <div>
        <h3 class="mb-3 text-[11px] font-semibold tracking-wide text-[#374151] uppercase">Account Information</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Customer Number</label>
            <input
              type="text"
              [value]="opportunity().customerCode"
              disabled
              class="h-8 w-full border border-[#cfd7e1] bg-[#e1e6ed] px-3 text-[13px] text-[#9ca3af]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Wholesale Pricing Tier</label>
            <select
              [value]="tier()"
              (change)="tier.set($any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]">
              <option value="Tier 1 · Bulk Wholesale">Tier 1 · Bulk Wholesale</option>
              <option value="Tier 2 · Contract">Tier 2 · Contract</option>
              <option value="Tier 3 · Standard">Tier 3 · Standard</option>
            </select>
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-xs font-normal text-[#374151]">Client / Business Name</label>
            <input
              type="text"
              [value]="client()"
              (input)="client.set($any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]" />
          </div>
        </div>
      </div>

      <!-- SECTION 2 -->
      <div class="border-t border-[#c5ced9] pt-5">
        <h3 class="mb-3 text-[11px] font-semibold tracking-wide text-[#374151] uppercase">Stage & Commercial Parameters</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Pipeline Stage</label>
            <select
              [value]="stage()"
              (change)="onStageChange($any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]">
              <option value="Lead / Qualification">Lead / Qualification (10%)</option>
              <option value="Volume Assessment">Volume Assessment (25%)</option>
              <option value="Quotation Sent">Quotation Sent (50%)</option>
              <option value="Negotiation">Negotiation (75%)</option>
              <option value="Closed Won">Closed Won (100%)</option>
            </select>
          </div>

          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Deal Value (ZAR)</label>
            <input
              type="number"
              [value]="value()"
              (input)="value.set(+$any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Expected Gross Margin (%)</label>
            <input
              type="number"
              step="0.1"
              [value]="margin()"
              (input)="margin.set(+$any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]" />
            @if (margin() < 18) {
              <p class="mt-1 text-xs text-red-700">Below 18.0% corporate margin floor.</p>
            }
          </div>

          <div>
            <label class="mb-1 block text-xs font-normal text-[#374151]">Next Follow-Up Date</label>
            <input
              type="date"
              [value]="followUpDate()"
              (input)="followUpDate.set($any($event.target).value)"
              class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933] shadow-[0_1px_2px_rgba(23,48,79,0.12)] focus:border-[#1b5a9a] focus:outline-none focus:ring-1 focus:ring-[#1b5a9a]" />
          </div>
        </div>
      </div>

      <!-- MODAL FOOTER -->
      <div class="flex items-center justify-end gap-2.5 border-t border-[#c5ced9] pt-3.5">
        <button
          type="button"
          (click)="close.emit()"
          class="inline-flex h-8 min-w-[5.5rem] items-center justify-center border border-t-[#b9c7d6] border-l-[#b9c7d6] border-b-[#8ba0b7] border-r-[#8ba0b7] bg-white px-4 text-[13px] font-normal text-[#17304f] shadow-[0_1px_2px_rgba(23,48,79,0.18)] transition-colors hover:bg-[#e1e6ed]">
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-8 min-w-[6rem] items-center justify-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-5 text-[13px] font-medium text-white shadow-[0_1px_2px_rgba(23,48,79,0.35)] transition-colors hover:bg-[#164b82]">
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
