<section class="w-full text-[13px] text-[#1f2933]">
  <div class="mb-3">
    <h3 class="text-[11px] font-semibold tracking-wide text-[#374151] uppercase">Accounts Receivable Aging Breakdown</h3>
    <p class="mt-1 text-xs text-[#4b5563]">Distribution of outstanding client balances by payment aging duration.</p>
  </div>

  <article class="border border-t-[3px] border-[#c5ced9] border-t-[#b8cbe0] bg-white p-5">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-4">
      @for (bracket of agingBrackets; track bracket.label) {
        <div class="border border-[#c5ced9] bg-[#fafbfd] p-4">
          <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 shrink-0" [style.background]="bracket.color"></span>
            <p class="text-xs font-medium text-[#374151]">{{ bracket.label }}</p>
          </div>
          <p class="mt-2 text-[18px] leading-6 font-bold tracking-tight text-[#17304f]">{{ zar(bracket.amount) }}</p>
          <div class="mt-3 h-2 overflow-hidden bg-[#e1e6ed]">
            <div class="h-full" [style.width.%]="bracket.percentage" [style.background]="bracket.color"></div>
          </div>
          <p class="mt-2 text-right text-xs text-[#4b5563]">{{ bracket.percentage }}% of total AR</p>
        </div>
      }
    </div>
  </article>
</section>
