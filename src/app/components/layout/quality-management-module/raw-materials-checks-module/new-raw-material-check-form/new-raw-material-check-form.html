<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4 backdrop-blur-[1px]">
  <div class="w-full max-w-lg border border-[#c5ced9] bg-white text-[13px] text-[#1f2933] shadow-lg">
    <div class="flex items-center justify-between border-b border-[#c5ced9] px-5 py-4">
      <div>
        <h3 class="text-base font-bold text-[#17304f]">New Raw Material Check</h3>
        <p class="mt-0.5 text-xs text-[#4b5563]">Log an incoming quality check on materials or packaging.</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close modal"
        class="flex h-7 w-7 cursor-pointer items-center justify-center text-[#4b5563] hover:bg-[#e1e6ed] hover:text-[#17304f]">
        ×
      </button>
    </div>

    <form (submit)="$event.preventDefault(); submit()" class="space-y-3.5 px-5 py-4">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Check ID</label>
          <input
            type="text"
            [value]="checkCode()"
            (input)="checkCode.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">GRN / Lot Ref</label>
          <input
            type="text"
            [value]="grnOrLotRef()"
            (input)="grnOrLotRef.set($any($event.target).value)"
            placeholder="e.g. GRN-2026-109"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Material / Packaging *</label>
          <input
            type="text"
            required
            [value]="materialName()"
            (input)="materialName.set($any($event.target).value)"
            placeholder="e.g. RO Filtration Cartridges"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Supplier</label>
          <input
            type="text"
            [value]="supplierName()"
            (input)="supplierName.set($any($event.target).value)"
            placeholder="Supplier name"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Parameter Measured *</label>
          <input
            type="text"
            required
            [value]="parameterMeasured()"
            (input)="parameterMeasured.set($any($event.target).value)"
            placeholder="e.g. TDS / Micron Integrity"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Spec Target</label>
          <input
            type="text"
            [value]="specTarget()"
            (input)="specTarget.set($any($event.target).value)"
            placeholder="e.g. < 15 ppm"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Status</label>
          <select
            [value]="status()"
            (change)="status.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-xs text-[#17304f]">
            <option value="Approved">Approved</option>
            <option value="On Hold">On Hold</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Date</label>
          <input
            type="date"
            [value]="checkedDate()"
            (input)="checkedDate.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Inspector</label>
          <input
            type="text"
            [value]="inspector()"
            (input)="inspector.set($any($event.target).value)"
            placeholder="Inspector name"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] px-3 text-xs text-[#17304f]" />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 border-t border-[#c5ced9] pt-3">
        <button
          type="button"
          (click)="close.emit()"
          class="inline-flex h-8 cursor-pointer items-center border border-[#b9c7d6] bg-white px-3.5 text-xs text-[#17304f] hover:bg-[#e1e6ed]">
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-8 cursor-pointer items-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-4 text-xs font-medium text-white hover:bg-[#164b82]">
          Save Check
        </button>
      </div>
    </form>
  </div>
</div>
