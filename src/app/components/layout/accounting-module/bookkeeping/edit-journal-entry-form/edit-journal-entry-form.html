<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-[1px]">
  <div class="w-full max-w-2xl border border-[#c5ced9] bg-white text-[13px] text-[#1f2933] shadow-lg">
    <div class="flex items-center justify-between border-b border-[#c5ced9] px-5 py-4">
      <div>
        <h2 class="text-[20px] leading-7 font-bold tracking-tight text-[#17304f]">Edit Journal Entry · {{ entry().id }}</h2>
        <p class="mt-0.5 text-xs text-[#4b5563]">Contingency edit for journal classification, amounts, or description</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close modal"
        class="flex h-8 w-8 items-center justify-center text-[#4b5563] transition-colors hover:bg-[#e1e6ed] hover:text-[#17304f]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form (submit)="$event.preventDefault(); submitEdit()" class="space-y-4 px-5 py-5">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs text-[#374151]">Date</label>
          <input
            type="date"
            [value]="entryDate()"
            (input)="entryDate.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>

        <div>
          <label class="mb-1 block text-xs text-[#374151]">Journal</label>
          <select
            [value]="journal()"
            (change)="journal.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none">
            <option value="CRJ">CRJ — Cash Receipts</option>
            <option value="CPJ">CPJ — Cash Payments</option>
            <option value="PJ">PJ — Purchases</option>
            <option value="SJ">SJ — Sales</option>
            <option value="GJ">GJ — General Journal</option>
          </select>
        </div>

        <div>
          <label class="mb-1 block text-xs text-[#374151]">Source Ref</label>
          <input
            type="text"
            [value]="sourceRef()"
            (input)="sourceRef.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>

        <div class="sm:col-span-2">
          <label class="mb-1 block text-xs text-[#374151]">Account Name</label>
          <input
            type="text"
            [value]="accountName()"
            (input)="accountName.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>

        <div>
          <label class="mb-1 block text-xs text-[#374151]">Account Code</label>
          <input
            type="text"
            [value]="accountCode()"
            (input)="accountCode.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>

        <div>
          <label class="mb-1 block text-xs text-[#374151]">Debit (ZAR)</label>
          <input
            type="number"
            step="0.01"
            min="0"
            [value]="debitAmount()"
            (input)="debitAmount.set(+$any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>

        <div>
          <label class="mb-1 block text-xs text-[#374151]">Credit (ZAR)</label>
          <input
            type="number"
            step="0.01"
            min="0"
            [value]="creditAmount()"
            (input)="creditAmount.set(+$any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>

        <div class="sm:col-span-3">
          <label class="mb-1 block text-xs text-[#374151]">Description</label>
          <input
            type="text"
            [value]="description()"
            (input)="description.set($any($event.target).value)"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] focus:border-[#1b5a9a] focus:outline-none" />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2.5 border-t border-[#c5ced9] pt-3.5">
        <button
          type="button"
          (click)="close.emit()"
          class="inline-flex h-8 min-w-[5.5rem] items-center justify-center border border-t-[#b9c7d6] border-l-[#b9c7d6] border-b-[#8ba0b7] border-r-[#8ba0b7] bg-white px-4 text-[13px] text-[#17304f] hover:bg-[#e1e6ed]">
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-8 min-w-[6rem] items-center justify-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-5 text-[13px] font-medium text-white hover:bg-[#164b82]">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
