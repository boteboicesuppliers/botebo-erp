<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4 backdrop-blur-[1px]">
  <div class="flex max-h-[90vh] w-full max-w-2xl flex-col border border-[#c5ced9] bg-white text-[13px] text-[#1f2933] shadow-lg">
    <div class="flex items-center justify-between border-b border-[#c5ced9] px-5 py-4">
      <div>
        <h2 class="text-[20px] leading-7 font-bold tracking-tight text-[#17304f]">New Product / Master Item</h2>
        <p class="mt-0.5 text-xs text-[#4b5563]">Add a product, material, packaging item, or service to the master register.</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Close modal"
        class="flex h-8 w-8 items-center justify-center text-[#4b5563] hover:bg-[#e1e6ed] hover:text-[#17304f]">
        &times;
      </button>
    </div>

    <form (ngSubmit)="submitForm()" class="space-y-4 overflow-y-auto px-5 py-5">
      @if (errorMessage()) {
        <div class="border border-red-300 bg-red-50 px-3 py-2 text-xs font-medium text-red-800">
          {{ errorMessage() }}
        </div>
      }

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">SKU / Code *</label>
          <input
            type="text"
            [ngModel]="sku()"
            (ngModelChange)="sku.set($event)"
            name="sku"
            placeholder="e.g. ICE-10KG-BLK"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Item Type</label>
          <select
            [ngModel]="itemKind()"
            (ngModelChange)="itemKind.set($event)"
            name="itemKind"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#17304f]">
            <option value="Finished Good">Finished Good</option>
            <option value="Raw Material">Raw Material</option>
            <option value="Packaging">Packaging</option>
            <option value="Service">Service</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Item Name *</label>
          <input
            type="text"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            name="name"
            placeholder="e.g. 10kg Block Ice"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Category</label>
          <input
            type="text"
            [ngModel]="category()"
            (ngModelChange)="category.set($event)"
            name="category"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-4">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Unit of Measure</label>
          <input
            type="text"
            [ngModel]="unitOfMeasure()"
            (ngModelChange)="unitOfMeasure.set($event)"
            name="unitOfMeasure"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Std Cost (R)</label>
          <input
            type="number"
            step="0.01"
            [ngModel]="standardCost()"
            (ngModelChange)="standardCost.set($event)"
            name="standardCost"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Base Price (R)</label>
          <input
            type="number"
            step="0.01"
            [ngModel]="basePrice()"
            (ngModelChange)="basePrice.set($event)"
            name="basePrice"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#1f2933]" />
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-[#374151]">Status</label>
          <select
            [ngModel]="status()"
            (ngModelChange)="status.set($event)"
            name="status"
            class="h-8 w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white px-3 text-[13px] text-[#17304f]">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-xs font-medium text-[#374151]">Notes</label>
        <textarea
          rows="2"
          [ngModel]="notes()"
          (ngModelChange)="notes.set($event)"
          name="notes"
          placeholder="Specifications, pack size, or usage notes..."
          class="w-full border border-t-[#c9d4e1] border-l-[#c9d4e1] border-b-[#9fb0c3] border-r-[#9fb0c3] bg-white p-2.5 text-[13px] text-[#1f2933]"></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 border-t border-[#c5ced9] pt-4">
        <button
          type="button"
          (click)="close.emit()"
          class="inline-flex h-8 items-center border border-[#b9c7d6] bg-white px-3.5 text-xs text-[#17304f] hover:bg-[#e1e6ed]">
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-8 items-center border border-t-[#2c5282] border-l-[#2c5282] border-b-[#12283f] border-r-[#12283f] bg-[#1b5a9a] px-4 text-xs font-medium text-white hover:bg-[#164b82]">
          Save Product
        </button>
      </div>
    </form>
  </div>
</div>
